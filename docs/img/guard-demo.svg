<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Terminal: a new vault commits cleanly; a commit containing a token is blocked by the pre-commit hook"><style>
  .bg{fill:#ffffff} .ink{fill:#16161a} .muted{fill:#5d5d66} .faint{fill:#8b8b94}
  .line{stroke:#e7e5df} .card{fill:#ffffff;stroke:#e7e5df} .hot{fill:#e8ecfb;stroke:#3b5bdb}
  .acc{fill:#3b5bdb} .accs{stroke:#3b5bdb} .soft{fill:#e8ecfb} .warn{fill:#c2410c} .warns{stroke:#c2410c}
  .warnsoft{fill:#fdf0e8} .zero{fill:#e7e5df} .edge{stroke:#8b8b94} .grey{fill:#8b8b94} .term{fill:#16161a}
  .tt{fill:#e9e9ee} .tg{fill:#7ee2a8} .ty{fill:#ffd479} .tr{fill:#ff8f8f} .tb{fill:#9db4ff}
  text{font-family:Inter,ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .ink{fill:#e6edf3} .muted{fill:#a2a2ad} .faint{fill:#7d8590}
    .line{stroke:#30363d} .card{fill:#161b22;stroke:#30363d} .hot{fill:#1d2340;stroke:#8ea4ff}
    .acc{fill:#8ea4ff} .accs{stroke:#8ea4ff} .soft{fill:#1d2340} .warn{fill:#fb923c} .warns{stroke:#fb923c}
    .warnsoft{fill:#2d1c10} .zero{fill:#30363d} .edge{stroke:#7d8590} .grey{fill:#7d8590} .term{fill:#010409}
  }
</style><rect class="bg" width="960" height="330" rx="14"/><rect class="term" x="0" y="0" width="960" height="330" rx="14"/><circle cx="26" cy="24" r="6" fill="#ff5f57"/><circle cx="46" cy="24" r="6" fill="#febc2e"/><circle cx="66" cy="24" r="6" fill="#28c840"/><text x="480.0" y="28.0" class="tt mono" font-size="12" text-anchor="middle" font-weight="400" opacity="0.6">pos — starter kit, first commit, blocked leak</text><text x="28.0" y="70.0" class="tb mono" font-size="13.5" text-anchor="start" font-weight="400" >$ pos init ~/my-os --owner &quot;Test User&quot;</text><text x="28.0" y="95.0" class="tt mono" font-size="13.5" text-anchor="start" font-weight="400" >created 25 files</text><text x="28.0" y="120.0" class="tb mono" font-size="13.5" text-anchor="start" font-weight="400" >$ git commit -m init</text><text x="28.0" y="145.0" class="tt mono" font-size="13.5" text-anchor="start" font-weight="400" >semantic propagation review: example-project, learning, meta, projects, self</text><text x="28.0" y="170.0" class="tg mono" font-size="13.5" text-anchor="start" font-weight="400" >block graph valid: 5 local + 0 external blocks</text><text x="28.0" y="195.0" class="tg mono" font-size="13.5" text-anchor="start" font-weight="400" >privacy scan clean: 25 file(s), 7 secret rules</text><text x="28.0" y="220.0" class="tb mono" font-size="13.5" text-anchor="start" font-weight="400" >$ echo &quot;token: ghp_aaaa…&quot; &gt; 30-projects/leak.md &amp;&amp; git commit -am leak</text><text x="28.0" y="245.0" class="tr mono" font-size="13.5" text-anchor="start" font-weight="400" >privacy scan BLOCK: 1 finding(s) in 1 file(s)</text><text x="28.0" y="270.0" class="tr mono" font-size="13.5" text-anchor="start" font-weight="400" >  30-projects/leak.md:1: secret: github token: gh***a</text><text x="28.0" y="295.0" class="ty mono" font-size="13.5" text-anchor="start" font-weight="400" >pre-commit BLOCK: move secrets to a password manager.</text></svg>
