[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-os"
version = "0.1.0"
description = "A local-first memory and operating layer for AI agents, built on plain Markdown and git."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Georgy Pevchikh" }]
dependencies = []

[project.scripts]
pos = "personal_os.cli:main"

[tool.setuptools]
packages = ["personal_os"]
include-package-data = true

[tool.setuptools.package-data]
personal_os = ["kit/*", "kit/**/*"]
